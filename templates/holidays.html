<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門公眾假期一覽</title>
    <meta name="description" content="澳門特別行政區公眾假期排序與查詢工具，資料來自澳門特區政府入口網站">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="aurora" aria-hidden="true"></div>

    <div class="page">
        <header class="hero">
            <div class="hero-main">
                <p class="hero-kicker">澳門特別行政區 · Macao SAR</p>
                <h1 class="hero-title"><span id="display-year">—</span><span class="hero-year-suffix">年</span>公眾假期</h1>
                <p class="hero-sub">
                    共 <strong id="stat-total">0</strong> 日
                    <span class="dot" aria-hidden="true">·</span>
                    資料來源：<a id="source-link" href="https://www.gov.mo/zh-hant/public-holidays/" target="_blank" rel="noopener">澳門特區政府入口網站</a>
                    <span class="dot" aria-hidden="true">·</span>
                    <span id="fetched-at"></span>
                </p>
            </div>

            <div class="hero-side">
                <div class="next-holiday" id="next-holiday" hidden>
                    <p class="next-label">下一個假期</p>
                    <p class="next-name">—</p>
                    <p class="next-countdown">—</p>
                </div>
                <div class="stat-chips" id="stat-chips"></div>
            </div>
        </header>

        <section class="toolbar" aria-label="篩選與操作">
            <div class="toolbar-group year-pills" id="year-pills" role="group" aria-label="年份切換" data-years="{{ available_years | join(',') }}"></div>

            <div class="toolbar-group grow">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="search" id="search-input" class="search-input" placeholder="搜尋假期名稱或日期…" autocomplete="off">
            </div>

            <div class="toolbar-group month-range">
                <select id="start-month" class="month-select" aria-label="開始月份"></select>
                <span class="range-sep">→</span>
                <select id="end-month" class="month-select" aria-label="結束月份"></select>
                <button type="button" id="highlight-btn" class="btn btn-ghost">高亮</button>
                <button type="button" id="clear-highlight-btn" class="btn btn-ghost subtle" title="清除高亮">×</button>
            </div>

            <div class="toolbar-group">
                <button type="button" id="copy-all-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
                    複製全部
                </button>
            </div>
        </section>

        <details class="url-panel">
            <summary>自訂來源網址</summary>
            <form id="url-form" class="url-form">
                <input type="url" id="url-input" name="url" placeholder="https://www.gov.mo/zh-hant/public-holidays/year-2026/">
                <button type="submit" class="btn btn-ghost">載入</button>
            </form>
        </details>

        <div class="error-banner" id="error-banner" role="alert" hidden></div>

        <main class="month-grid" id="month-grid" aria-live="polite"></main>

        <footer class="page-footer">
            <span class="legend">
                <span class="badge badge-mandatory">強制性假日</span>
                <span class="badge badge-compensate">補假日</span>
                <span class="badge badge-half">半天假</span>
                <span class="legend-hint">點擊任意假期即可複製「日期 · 名稱」</span>
            </span>
            <button type="button" id="theme-toggle" class="btn btn-ghost subtle">🌗 深色模式</button>
        </footer>
    </div>

    <script type="application/json" id="bootstrap-data">{{ payload | tojson }}</script>
    <script src="{{ url_for('static', filename='holidays.js') }}"></script>
</body>
</html>
